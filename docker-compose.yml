services:
  mangakuro:
    image: ghcr.io/o-f3l1x-o/mangakuro:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mangakuro
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Datos de la aplicación (sesiones en caliente y configuración)
      - ./data:/app/data
      # Carpeta destino leída por Komga (ajústala a tu biblioteca de cómics)
      - ./data/export:/comics_library
    environment:
      - EXPORT_DIR=/comics_library
      - PYTHONUNBUFFERED=1
