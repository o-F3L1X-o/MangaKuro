services:
  mangakuro:
    image: ghcr.io/o-f3l1x-o/mangakuro:latest
    pull_policy: always
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mangakuro
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Datos de la aplicación (sesiones en caliente, staging y configuración)
      - ./data:/app/data
      # Carpeta destino leída por Komga (ajústala a tu biblioteca de cómics)
      - ./data/export:/comics_library
      # Montajes de red del host para leer/escribir en SMB/CIFS/NFS o discos externos
      - /mnt:/mnt
      - /media:/media
    environment:
      - DATA_DIR=/app/data
      - STAGING_DIR=/app/data/staging
      - EXPORT_DIR=/comics_library
      - PYTHONUNBUFFERED=1
